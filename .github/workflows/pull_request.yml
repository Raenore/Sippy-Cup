---
name: Pull Request
on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/checkout@v7

      - name: Install validation dependencies
        run: python -m pip install -r .github/scripts/requirements.txt

      - name: Run Luacheck
        id: luacheck
        if: contains(github.event.pull_request.labels.*.name, 'documentation') == false
        uses: nebularg/actions-luacheck@v1
        continue-on-error: true
        with:
          args: --no-color -q
          files: $(git ls-files '*.lua' ':!:Locales/????.lua')
          annotate: warning

      - name: Run editorconfig-checker
        id: editorconfig
        if: contains(github.event.pull_request.labels.*.name, 'documentation') == false
        uses: wow-rp-addons/actions-editorconfig-check@v1.0.2
        continue-on-error: true
        with:
          args: -no-color
          files: $(git ls-files '*.lua' '*.sh' '*.xml' ':!:Locales/*.lua')

      - name: Run XML schema validation
        id: validate_xml
        continue-on-error: true
        run: python .github/scripts/validate_xml.py $(git ls-files '*.xml' ':!:Bindings.xml')

      - name: Check lint results
        if: steps.luacheck.outcome == 'failure' || steps.editorconfig.outcome == 'failure' || steps.validate_xml.outcome == 'failure'
        run: |
          echo "Luacheck: ${{ steps.luacheck.outcome }}"
          echo "editorconfig-checker: ${{ steps.editorconfig.outcome }}"
          echo "XML validation: ${{ steps.validate_xml.outcome }}"
          exit 1

      - name: Create Package
        uses: BigWigsMods/packager@v2
        with:
          args: -dz

      - uses: actions/upload-artifact@v7
        with:
          name: SippyCup-PR-${{ github.event.number }}
          path: .release/
          archive: true
          include-hidden-files: true

      - name: Send Webhook Notification
        if: failure()
        uses: ./.github/actions/send-webhook-notification
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
